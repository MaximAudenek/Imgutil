[package]
name = "imgutil"
version = "0.1.0"
edition = "2024"

[dependencies]
chacha20poly1305 = "0.10"
chacha20         = "0.9"
poly1305         = "0.8"
argon2           = "0.5"
zeroize          = { version = "1.7", features = ["derive"] }
secrecy          = "0.8"
subtle           = "2.5"
rand             = "0.8"
png              = "0.17"
rpassword        = "7.3"
clap             = { version = "4.4", features = ["derive"] }
indicatif        = "0.17"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_System_Memory"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
strip = true
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
